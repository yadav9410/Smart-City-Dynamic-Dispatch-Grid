<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0; padding: 5px 0 3px; color: #eafcff; background: transparent;
    }
    .gps-button {
      width: 100%; min-height: 66px; display: flex; align-items: center; justify-content: center;
      gap: 13px; padding: 12px 18px; border-radius: 15px; cursor: pointer;
      color: #f0fffe; text-align: left; font-size: 15px; font-weight: 750;
      border: 1px solid rgba(94,234,212,.72);
      background: linear-gradient(105deg, #0f766e 0%, #0e7490 55%, #155e75 100%);
      box-shadow: 0 8px 24px rgba(13,148,136,.23), inset 0 1px 0 rgba(255,255,255,.12);
      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
    }
    .gps-button:hover:not(:disabled) {
      transform: translateY(-1px); filter: brightness(1.1);
      box-shadow: 0 11px 28px rgba(13,148,136,.3), inset 0 1px 0 rgba(255,255,255,.14);
    }
    .gps-button:focus-visible { outline: 3px solid #67e8f9; outline-offset: 3px; }
    .gps-button:disabled { cursor: wait; opacity: .72; }
    .pin-icon {
      width: 38px; height: 38px; flex: 0 0 38px; display: inline-flex;
      align-items: center; justify-content: center; border-radius: 12px;
      background: rgba(255,255,255,.14); font-size: 21px;
    }
    .button-copy { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .button-title { line-height: 1.25; }
    .button-hint { font-size: 11px; font-weight: 500; color: rgba(240,255,254,.82); }
    .arrow { font-size: 22px; opacity: .85; margin-left: auto; }
    #status { font-size: 12px; margin: 7px 2px 0; color: #a9b8cc; line-height: 1.4; min-height: 17px; }
  </style>
</head>
<body>
  <button id="locate" class="gps-button" type="button">
    <span class="pin-icon" aria-hidden="true">⌖</span>
    <span class="button-copy">
      <span class="button-title">Use my current location</span>
      <span class="button-hint">Fastest option · Your browser will ask permission</span>
    </span>
    <span class="arrow" aria-hidden="true">→</span>
  </button>
  <div id="status" role="status" aria-live="polite">Your location is only stored with your separate consent below.</div>
  <script>
    (function () {
      const button = document.getElementById("locate");
      const status = document.getElementById("status");
      function sendValue(value) {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:setComponentValue",
          value: value,
          dataType: "json"
        }, "*");
      }
      function setFrameHeight() {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:setFrameHeight",
          height: document.body.scrollHeight
        }, "*");
      }
      button.addEventListener("click", function () {
        if (!navigator.geolocation) {
          const message = "This browser does not support location access. Choose a map pin or enter a landmark instead.";
          status.textContent = message;
          sendValue({status: "error", message: message});
          return;
        }
        button.disabled = true;
        status.textContent = "Waiting for browser permission and location…";
        button.querySelector(".button-title").textContent = "Finding your location…";
        navigator.geolocation.getCurrentPosition(
          function (position) {
            const result = {
              status: "success",
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              accuracy_m: position.coords.accuracy,
              captured_at: new Date().toISOString()
            };
            status.textContent = "Location received. Review the map pin and choose whether to store it below.";
            button.querySelector(".button-title").textContent = "Current location selected";
            sendValue(result);
            button.disabled = false;
            setFrameHeight();
          },
          function (error) {
            let message = "Location permission or position was unavailable. Choose a map pin or enter a landmark instead.";
            if (error && error.code === 1) message = "Location permission was denied. You can still choose a pin on the map or enter a landmark.";
            if (error && error.code === 3) message = "The location request timed out. Try again or use the map pin/manual coordinates.";
            status.textContent = message;
            button.querySelector(".button-title").textContent = "Use my current location";
            sendValue({status: "error", message: message});
            button.disabled = false;
            setFrameHeight();
          },
          { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 }
        );
      });
      window.addEventListener("message", function (event) {
        if (event.data && event.data.type === "streamlit:render") setFrameHeight();
      });
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:componentReady",
        apiVersion: 1
      }, "*");
      setFrameHeight();
    })();
  </script>
</body>
</html>
